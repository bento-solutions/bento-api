<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{heading}}</title>
</head>
<!--
  One layout for the emails an Account receives about itself: confirming its address, choosing a
  new password, and being told it already exists. Same table-based, inline-styled layout as
  invitation.html, for the same reason: mail clients strip <style> blocks and ignore flexbox.
  Every value is HTML-escaped by AccountService before it is substituted.
-->
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafafa;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
          <tr>
            <td style="padding:32px 32px 0 32px;">
              <p style="margin:0 0 24px 0;font-size:18px;font-weight:700;color:#09090b;letter-spacing:-0.01em;">Bento CRM</p>
              <h1 style="margin:0 0 12px 0;font-size:20px;line-height:1.35;font-weight:700;color:#09090b;">{{heading}}</h1>
              <p style="margin:0 0 20px 0;font-size:14px;line-height:1.6;color:#52525b;">{{body}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 8px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#2563eb;border-radius:10px;">
                    <a href="{{url}}"
                       style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">
                      {{buttonLabel}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px 32px;">
              <p style="margin:0 0 20px 0;font-size:12px;line-height:1.6;color:#71717a;">
                If the button does not work, paste this link into your browser:<br />
                <a href="{{url}}" style="color:#2563eb;word-break:break-all;">{{url}}</a>
              </p>
              <p style="margin:0;padding-top:20px;border-top:1px solid #f4f4f5;font-size:12px;line-height:1.6;color:#a1a1aa;">
                This email was sent to {{email}}. {{footer}}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

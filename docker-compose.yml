services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # Bound to loopback: reachable from the host (and over an SSH tunnel), never
    # from the internet. Docker publishes ports past ufw, so the bind address is
    # the only thing keeping this private.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  app:
    # `image` lets CI deploy by `docker compose pull` (BACKEND_IMAGE_TAG set to the
    # commit-sha tag GHCR just built); `build` keeps `docker compose up -d --build`
    # working unchanged for local/manual use.
    image: ghcr.io/bento-solutions/bento-backend-app:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crm_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env, at least 32 characters}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://crmbento.com,https://www.crmbento.com,https://dev.crmbento.com,http://localhost:4200,http://localhost:4201,http://localhost:3000}
      # Outbound SMTP for invitation email, via Hostinger's relay. MAIL_PASSWORD is the
      # mailbox password from hPanel, not the Hostinger account password. With MAIL_USERNAME
      # unset the backend skips sending and logs the message instead, so a missing .env
      # degrades to "no email" rather than a failed invite.
      MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@crmbento.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Bento CRM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      # Must point at the frontend, which serves the /invite/accept route -- not at this API.
      INVITATION_ACCEPT_URL: ${INVITATION_ACCEPT_URL:-https://crmbento.com/invite/accept}
      INVITATION_EXPIRY_DAYS: ${INVITATION_EXPIRY_DAYS:-7}
      # WhatsApp bot (Baileys) on the internal network. Blank keys disable linking.
      WHATSAPP_BOT_BASE_URL: ${WHATSAPP_BOT_BASE_URL:-http://whatsapp-bot:3000}
      WHATSAPP_BOT_API_KEY: ${WHATSAPP_BOT_API_KEY:-}
      BAILEYS_WEBHOOK_SECRET: ${BAILEYS_WEBHOOK_SECRET:-}
    volumes:
      - ./uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - crm-network
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.crm-backend.rule=Host(`api.crmbento.com`)"
      - "traefik.http.routers.crm-backend.entrypoints=websecure"
      - "traefik.http.routers.crm-backend.tls=true"
      - "traefik.http.routers.crm-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm-backend.loadbalancer.server.port=8080"
      # The bot calls /webhooks/baileys directly on the internal network; nothing from the
      # internet may reach it. This longer (so higher-priority) rule catches the path at the
      # edge and an allow-list of loopback only answers 403 to everyone.
      - "traefik.http.routers.crm-backend-bot-hook.rule=Host(`api.crmbento.com`) && PathPrefix(`/api/v1/webhooks/baileys`)"
      - "traefik.http.routers.crm-backend-bot-hook.entrypoints=websecure"
      - "traefik.http.routers.crm-backend-bot-hook.tls=true"
      - "traefik.http.routers.crm-backend-bot-hook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-backend-bot-hook.service=crm-backend"
      - "traefik.http.routers.crm-backend-bot-hook.middlewares=crm-backend-bot-hook-deny"
      - "traefik.http.middlewares.crm-backend-bot-hook-deny.ipallowlist.sourcerange=127.0.0.1/32"
      - "traefik.http.services.crm-backend.loadbalancer.healthcheck.path=/api/v1/actuator/health"
      - "traefik.http.services.crm-backend.loadbalancer.healthcheck.interval=15s"
      - "traefik.http.services.crm-backend.loadbalancer.healthcheck.timeout=5s"

  whatsapp-bot:
    # Only started by deploy-bot.sh (`--profile whatsapp`): the plain `up -d` in deploy.sh never
    # touches it, so backend deploys do not restart the linked WhatsApp sessions.
    profiles: ["whatsapp"]
    image: ghcr.io/bento-solutions/bento-whatsapp-bot:${WHATSAPP_BOT_IMAGE_TAG:-latest}
    container_name: crm-whatsapp-bot
    restart: unless-stopped
    environment:
      # Checked by the bot at startup (it refuses to run without them).
      API_KEY: ${WHATSAPP_BOT_API_KEY:-}
      WEBHOOK_SECRET: ${BAILEYS_WEBHOOK_SECRET:-}
      WEBHOOK_URL: http://app:8080/api/v1/webhooks/baileys
      LOG_LEVEL: ${WHATSAPP_BOT_LOG_LEVEL:-info}
    volumes:
      # Signal session keys and the event spool. Owned by uid 1000, mode 700, never copied off
      # the box. Each environment has its own directory: two bots on one session get it replaced.
      - ${WHATSAPP_BOT_DATA_DIR:-/srv/bento/data/whatsapp-bot}:/data
    mem_limit: 1536m
    # Time to close every socket cleanly (no half-written credential file) and flush the spool.
    stop_grace_period: 30s
    # Internal network only: never on the proxy network, never published.
    networks:
      - crm-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    # Loopback only. pgAdmin is a full DB console with no TLS here, so reach it
    # through an SSH tunnel: ssh -L 5050:127.0.0.1:5050 bento-prod
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - crm-network

volumes:
  postgres_data:
  redis_data:

networks:
  crm-network:
    driver: bridge
  proxy:
    external: true
